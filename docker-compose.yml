services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in the deployment environment}
    expose:
      - '3000'
    volumes:
      - media:/app/media

volumes:
  media:
